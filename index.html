const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['Quote','Confirmed','In Progress','Waiting','Completed','Cancelled'];
const cats=['Fabrication','Electrical','Plumbing','Mechanical','Carpentry','Phone repair','Other'];
const emptyState=()=>({jobs:[],expenses:[],payments:[],customers:[],events:[],demoLoaded:false});
let state=load(),page='home',selectedJob=null,jobFilter='All',jobSearch='',moneyFilter='All',customerSearch='',toastTimer=null,receiptJob=null,receiptShowCosts=false;

function loadDemo(){if(state.demoLoaded||state.jobs.length)return;const now=new Date(),ago=n=>{let d=new Date(now);d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const samples=[
{id:'demo1',title:'Security gate fabrication',customer:'Musa Ibrahim',phone:'0803 000 1122',category:'Fabrication',description:'Fabricate and install a double-leaf security gate. Confirm final measurements before cutting.',price:180000,estimate:75000,due:ago(-3),priority:'High',status:'In Progress',notes:'Confirm paint finish with customer.',created:ago(5),demo:true},
{id:'demo2',title:'Shop wiring repairs',customer:'Grace Okafor',phone:'0805 000 4488',category:'Electrical',description:'Inspect two faulty sockets and repair shop lighting.',price:65000,estimate:18000,due:ago(2),priority:'Normal',status:'Confirmed',notes:'',created:ago(3),demo:true},
{id:'demo3',title:'Water pump maintenance',customer:'Abdul Bello',phone:'0812 000 0933',category:'Mechanical',description:'Service water pump and replace worn seals if needed.',price:42000,estimate:12000,due:ago(-1),priority:'Normal',status:'Waiting',notes:'Awaiting customer approval for extra parts.',created:ago(1),demo:true},
{id:'demo4',title:'Generator bracket repair',customer:'Musa Ibrahim',phone:'0803 000 1122',category:'Fabrication',description:'Repair and reinforce generator support bracket.',price:35000,estimate:9000,due:ago(4),priority:'Low',status:'Completed',notes:'',created:ago(9),demo:true}];
state.jobs=samples;state.expenses=[{id:'de1',jobId:'demo1',label:'Steel and hinges',category:'Materials',amount:55000,date:ago(2),note:''},{id:'de2',jobId:'demo1',label:'Transport',category:'Transport',amount:5000,date:ago(1),note:''},{id:'de3',jobId:'demo2',label:'Cable and sockets',category:'Materials',amount:14000,date:ago(2),note:''},{id:'de4',jobId:'demo4',label:'Welding rods',category:'Materials',amount:8000,date:ago(7),note:''}];state.payments=[{id:'dp1',jobId:'demo1',amount:100000,date:ago(1),method:'Transfer',note:'Part payment'},{id:'dp2',jobId:'demo2',amount:30000,date:ago(1),method:'Cash',note:'Deposit'},{id:'dp3',jobId:'demo4',amount:35000,date:ago(5),method:'Transfer',note:'Paid in full'}];state.demoLoaded=true;save()}
function totals(j){const expenses=state.expenses.filter(e=>e.jobId===j.id),payments=state.payments.filter(p=>p.jobId===j.id);const actual=expenses.reduce((a,e)=>a+Number(e.amount||0),0),paid=payments.reduce((a,p)=>a+Number(p.amount||0),0),cost=actual>0?actual:Number(j.estimate||0);return {expenses, payments, actual,paid,balance:Math.max(0,Number(j.price||0)-paid),cost,profit:Number(j.price||0)-cost}}
function allTotals(){const jobs=state.jobs.filter(j=>j.status!=='Cancelled'),paid=state.payments.reduce((a,p)=>a+Number(p.amount||0),0),month= new Date().toISOString().slice(0,7),receivedMonth=state.payments.filter(p=>p.date&&p.date.slice(0,7)===month).reduce((a,p)=>a+Number(p.amount||0),0),outstanding=jobs.reduce((a,j)=>a+totals(j).balance,0),profit=jobs.reduce((a,j)=>a+totals(j).profit,0),active=jobs.filter(j=>!['Completed','Cancelled'].includes(j.status)).length;return {jobs,paid,receivedMonth,outstanding,profit,active}}

function btn(label,action,cls=''){return '<button class="btn '+cls+'" data-action="'+action+'">'+label+'</button>'}
function stat(label,value,icon,note,good=false){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="stat-note '+(good?'good':'')+'">'+note+'</div></div>'}
function jobRow(j){const t=totals(j);return '<tr data-action="open-job" data-id="'+j.id+'"><td><div class="job-name">'+esc(j.title)+'</div><div class="job-meta">'+esc(j.customer)+' · '+esc(j.category)+'</div></td><td>'+badge(j.status)+'</td><td class="money">'+fmt(j.price)+'</td><td class="money">'+fmt(t.balance)+'</td><td class="muted">'+shortDate(j.due)+'</td></tr>'}
function empty(msg,sub,action='new-job'){return '<div class="empty"><div class="empty-symbol">◌</div><b>'+msg+'</b><br>'+sub+'<div style="margin-top:15px">'+btn('＋ Create a job',action,'primary')+'</div></div>'}
function dashboard(){const t=allTotals(),counts=statuses.map(s=>({s,n:state.jobs.filter(j=>j.status===s).length})),att=state.jobs.filter(j=>!['Completed','Cancelled'].includes(j.status)&&((j.due&&j.due<today())||totals(j).balance>0)).slice(0,4),recent=[...state.jobs].sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,5);return header('YOUR WORKSPACE','Know where every job stands.','A clearer picture of your work, money, and what needs attention.',btn('＋ New job','new-job','primary'))+
'<section class="hero"><div><div class="hero-label">Outstanding balance</div><div class="hero-number">'+fmt(t.outstanding)+'</div><div class="hero-foot">Money customers still owe you · across active jobs</div></div>'+btn('Review payments ↗','money','')+'</section>'+
'<section class="stats">'+stat('Active jobs',t.active,'▤','Jobs still in progress')+stat('Received this month',fmt(t.receivedMonth),'↙','Payments recorded this month',true)+stat('Outstanding',fmt(t.outstanding),'◷','Across non-cancelled jobs')+stat('Est. net profit',fmt(t.profit),'↗','Based on recorded costs',true)+'</section>'+
'<section class="grid-two"><div class="card"><div class="card-head"><div><div class="card-title">Your job pipeline</div><div class="card-sub">A quick view of work in every stage</div></div><button class="text-btn" data-page="jobs">All jobs ↗</button></div><div class="pipeline">'+counts.filter(x=>x.s!=='Cancelled').map(x=>'<div class="pipe"><div class="pipe-num">'+x.n+'</div><div class="pipe-label">'+x.s+'</div><div class="pipe-bar"><span style="width:'+(state.jobs.length?Math.max(0,Math.min(100,x.n/state.jobs.length*100)):0)+'%"></span></div></div>').join('')+'</div></div><div class="card"><div class="card-head"><div><div class="card-title">Needs your attention</div><div class="card-sub">A few things worth checking</div></div><span class="stat-icon">!</span></div><div class="attention-list">'+(att.length?att.map(j=>'<div class="attention"><span class="attention-dot" style="background:'+(j.due&&j.due<today()?'var(--red)':'var(--amber)')+'"></span><div><div class="attention-title">'+esc(j.title)+'</div><div class="attention-desc">'+esc(j.customer)+' · '+(j.due&&j.due<today()?'Past due · ':'')+fmt(totals(j).balance)+' still owed</div></div></div>').join(''):'<div class="attention-empty">All caught up. No urgent job or payment issues showing here.</div>')+'</div></div></section>'+
'<section class="card table-card"><div class="table-head"><div><div class="card-title">Recently added jobs</div><div class="card-sub">Open a job to see the full story</div></div><button class="text-btn" data-page="jobs">View all jobs ↗</button></div>'+jobTable(recent)+'</section>'+
'<div class="notice">✳ Demo workspace: the sample jobs are illustrative. Add your own job or clear demo data in Settings. Your records stay in this browser.</div>'}
function jobTable(list){if(!list.length)return empty('No jobs yet','Start by adding your first job.');return '<div class="table-wrap"><table><thead><tr><th>Job / Customer</th><th>Status</th><th>Agreed price</th><th>Still owed</th><th>Due date</th></tr></thead><tbody>'+list.map(jobRow).join('')+'</tbody></table></div>'}
function jobsPage(){const list=state.jobs.filter(j=>(jobFilter==='All'||j.status===jobFilter)&&((j.title+' '+j.customer+' '+j.category).toLowerCase().includes(jobSearch.toLowerCase()))).sort((a,b)=>(b.created||'').localeCompare(a.created||''));return header('JOB BOOK','Your jobs, in one place.','Keep the brief, price, costs, and next step together.',btn('＋ New job','new-job','primary'))+'<div class="searchbar"><input class="field search" id="jobSearch" placeholder="Search jobs or customers…" value="'+esc(jobSearch)+'"><select class="select" id="jobFilter"><option>All</option>'+statuses.map(s=>'<option '+(jobFilter===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><section class="card table-card"><div class="table-head"><div><div class="card-title">'+list.length+' jobs</div><div class="card-sub">Select a row to open job details</div></div></div>'+jobTable(list)+'</section>'}
function moneyPage(){const tt=allTotals(),received=state.payments.filter(p=>moneyFilter==='All'||p.date?.slice(0,7)===moneyFilter).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),expenses=state.expenses.filter(e=>moneyFilter==='All'||e.date?.slice(0,7)===moneyFilter).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const months=[...new Set([...state.payments.map(p=>p.date?.slice(0,7)),...state.expenses.map(e=>e.date?.slice(0,7))].filter(Boolean))].sort().reverse();return header('THE MONEY VIEW','Keep the numbers honest.','See what came in, what went out, and what is still owed.',btn('＋ Record payment','add-payment','primary'))+'<section class="stats">'+stat('All-time received',fmt(tt.paid),'↙','Payments recorded',true)+stat('Still owed',fmt(tt.outstanding),'◷','Outstanding on active work')+stat('Recorded expenses',fmt(state.expenses.reduce((a,e)=>a+Number(e.amount||0),0)),'↗','Actual expenses entered')+stat('Estimated net profit',fmt(tt.profit),'✳','Revenue minus known costs',true)+'</section><div class="searchbar"><select class="select" id="moneyFilter"><option value="All">All time</option>'+months.map(m=>'<option value="'+m+'" '+(moneyFilter===m?'selected':'')+'>'+new Date(m+'-15').toLocaleDateString('en',{month:'long',year:'numeric'})+'</option>').join('')+'</select></div><section class="grid-two"><div class="card"><div class="card-head"><div><div class="card-title">Payments received</div><div class="card-sub">Money customers have paid you</div></div></div>'+(received.length?received.map(p=>{let j=state.jobs.find(j=>j.id===p.jobId);return '<div class="list-item"><div><div class="list-main">'+esc(j?.title||'Deleted job')+'</div><div class="list-meta">'+esc(j?.customer||'')+' · '+shortDate(p.date)+' · '+esc(p.method)+'</div></div><div class="list-amount" style="color:var(--lime)">+'+fmt(p.amount)+'</div></div>'}).join(''):'<div class="empty">No payments in this period.</div>')+'</div><div class="card"><div class="card-head"><div><div class="card-title">Expenses recorded</div><div class="card-sub">Actual costs entered against jobs</div></div><button class="text-btn" data-action="add-expense">＋ Add</button></div>'+(expenses.length?expenses.map(e=>{let j=state.jobs.find(j=>j.id===e.jobId);return '<div class="list-item"><div><div class="list-main">'+esc(e.label)+'</div><div class="list-meta">'+esc(j?.title||'Deleted job')+' · '+shortDate(e.date)+' · '+esc(e.category)+'</div></div><div class="list-amount">−'+fmt(e.amount)+'</div></div>'}).join(''):'<div class="empty">No expenses in this period.</div>')+'</div></section><section class="card section-gap"><div class="card-head"><div><div class="card-title">Outstanding balances</div><div class="card-sub">Jobs with money still due</div></div></div>'+jobTable(state.jobs.filter(j=>j.status!=='Cancelled'&&totals(j).balance>0))+'</section>'}
function customersPage(){const groups={};state.jobs.forEach(j=>{let key=(j.customer||'Unknown').trim().toLowerCase();if(!groups[key])groups[key]={name:j.customer||'Unknown',phone:j.phone||'',jobs:[],revenue:0,paid:0,balance:0};const g=groups[key];g.jobs.push(j);g.revenue+=Number(j.price||0);g.paid+=totals(j).paid;g.balance+=totals(j).balance;if(!g.phone&&j.phone)g.phone=j.phone});const arr=Object.values(groups).filter(c=>(c.name+' '+c.phone).toLowerCase().includes(customerSearch.toLowerCase())).sort((a,b)=>b.balance-a.balance);return header('PEOPLE','Good work starts with good records.','Every customer, their job history, and what remains to be paid.',btn('＋ New job','new-job','primary'))+'<div class="searchbar"><input class="field search" id="customerSearch" placeholder="Find a customer…" value="'+esc(customerSearch)+'"></div><div class="customer-grid">'+(arr.length?arr.map(c=>'<article class="customer-card" data-action="customer-detail" data-customer="'+esc(c.name)+'"><div class="avatar">'+esc(initials(c.name))+'</div><div class="customer-name">'+esc(c.name)+'</div><div class="customer-phone">'+esc(c.phone||'No phone added')+'</div><div class="customer-foot"><span>'+c.jobs.length+' job'+(c.jobs.length===1?'':'s')+'</span><span>'+fmt(c.revenue)+'</span></div><div style="display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:11px"><span class="muted">Still owed</span><b style="color:'+(c.balance?'var(--amber)':'var(--lime)')+'">'+fmt(c.balance)+'</b></div></article>').join(''):'<div class="empty" style="grid-column:1/-1">No customers found. Add a job to create a customer record.</div>')+'</div>'}
function settingsPage(){return header('YOUR DATA','Your records belong to you.','Manage your local workspace and take your data with you.')+'<div class="settings-grid"><section class="card"><div class="card-head"><div><div class="card-title">Backup & export</div><div class="card-sub">Take a copy of your work records</div></div></div><div class="setting-row"><div><div class="setting-title">Full JSON backup</div><div class="setting-desc">Jobs, payments, expenses, and app data.</div></div>'+btn('Export JSON','export-json')+'</div><div class="setting-row"><div><div class="setting-title">Jobs CSV</div><div class="setting-desc">Open your job list in a spreadsheet.</div></div>'+btn('Export CSV','export-csv')+'</div><div class="setting-row"><div><div class="setting-title">Restore JSON backup</div><div class="setting-desc">Replace this browser&#39;s records from a backup.</div></div><button class="btn" data-action="import-json">Import</button></div><input type="file" id="importFile" accept=".json,application/json" class="hidden"></section><section class="card"><div class="card-head"><div><div class="card-title">Workspace management</div><div class="card-sub">Keep your data clear and safe</div></div></div><div class="setting-row"><div><div class="setting-title">Reset sample jobs</div><div class="setting-desc">Remove sample records and start fresh. This also removes sample payments and expenses.</div></div><button class="btn danger" data-action="clear-demo">Clear demo</button></div><div class="setting-row"><div><div class="setting-title">Delete all records</div><div class="setting-desc">Permanently clear this browser&#39;s WorkSlip data.</div></div><button class="btn danger" data-action="clear-all">Clear all</button></div></section></div><section class="card section-gap"><div class="card-title">Privacy, in plain language</div><p class="subtitle" style="margin-top:12px">WorkSlip stores your records in this browser on this device. It does not send job details to a server. Anyone with access to this browser profile may be able to see these records. Export a JSON backup regularly. Clearing browser storage may erase your data.</p><div class="notice">Financial summaries are estimates based on the prices, payments, and costs you enter. WorkSlip is a job book, not professional accounting or tax advice.</div></section>'}
function jobDetail(j){if(!j){page='jobs';render();return ''}const t=totals(j);return header('JOB DETAILS','The full picture.','Everything about this job, in one place.',btn('← All jobs','jobs','ghost'))+'<div class="detail-top"><div><div class="eyebrow">'+esc(j.category)+' · '+esc(j.priority)+' priority</div><h1 class="page-title" style="margin-top:7px">'+esc(j.title)+'</h1><div class="subtitle">'+esc(j.customer)+(j.phone?' · '+esc(j.phone):'')+'</div><div style="margin-top:10px">'+badge(j.status)+'</div></div><div class="actions">'+btn('Edit job','edit-job:'+j.id,'')+btn('Receipt ↗','receipt:'+j.id,'primary')+'</div></div><div class="detail-grid"><div><section class="detail-hero"><div class="eyebrow">Agreed job price</div><div class="amount">'+fmt(j.price)+'</div><div class="subtitle">'+(j.due?'Due '+shortDate(j.due):'No due date')+' · Created '+shortDate(j.created)+'</div><div class="detail-stats" style="margin-top:20px"><div class="detail-stat"><small>Received</small><strong>'+fmt(t.paid)+'</strong></div><div class="detail-stat"><small>Still owed</small><strong style="color:var(--amber)">'+fmt(t.balance)+'</strong></div><div class="detail-stat"><small>Est. profit</small><strong style="color:var(--lime)">'+fmt(t.profit)+'</strong></div></div></section><section class="card"><div class="card-head"><div><div class="card-title">Job brief</div><div class="card-sub">The agreement and important details</div></div><button class="text-btn" data-action="edit-job:'+j.id+'">Edit ↗</button></div><p style="font-size:13px;line-height:1.8;color:#dce0d5">'+esc(j.description||'No description added.')+'</p>'+(j.notes?'<div class="notice"><b>Internal notes</b><br>'+esc(j.notes)+'</div>':'')+'<div class="form-actions" style="justify-content:flex-start;flex-wrap:wrap"><select class="select" id="detailStatus">'+statuses.map(s=>'<option '+(j.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn" data-action="save-status:'+j.id+'">Update status</button></div></section><section class="card section-gap"><div class="card-head"><div><div class="card-title">Payments</div><div class="card-sub">Every payment recorded for this job</div></div><button class="btn primary" data-action="add-payment:'+j.id+'">＋ Record</button></div>'+(t.payments.length?t.payments.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>'<div class="list-item"><div><div class="list-main">'+esc(p.method)+' payment</div><div class="list-meta">'+shortDate(p.date)+(p.note?' · '+esc(p.note):'')+'</div></div><div style="display:flex;gap:9px;align-items:center"><span class="list-amount" style="color:var(--lime)">+'+fmt(p.amount)+'</span><button class="mini-btn" data-action="delete-payment:'+p.id+'">×</button></div></div>').join(''):'<div class="empty">No payments recorded yet.</div>')+'</section></div><div><section class="card"><div class="card-head"><div><div class="card-title">Costs & expenses</div><div class="card-sub">'+(t.actual?'Actual recorded costs':'Using estimated materials cost')+'</div></div><button class="btn" data-action="add-expense:'+j.id+'">＋ Add cost</button></div><div class="list-item"><div><div class="list-main">Estimated materials</div><div class="list-meta">Original estimate</div></div><div class="list-amount">'+fmt(j.estimate)+'</div></div>'+(t.expenses.length?t.expenses.map(e=>'<div class="list-item"><div><div class="list-main">'+esc(e.label)+'</div><div class="list-meta">'+esc(e.category)+' · '+shortDate(e.date)+'</div></div><div style="display:flex;align-items:center;gap:7px"><span class="list-amount">'+fmt(e.amount)+'</span><button class="mini-btn" data-action="delete-expense:'+e.id+'">×</button></div></div>').join(''):'<div class="list-meta" style="padding:12px 0">No actual expenses added yet.</div>')+'<div class="list-item"><div><div class="list-main">Total costs used</div><div class="list-meta">Actuals if recorded, otherwise estimate</div></div><div class="list-amount">'+fmt(t.cost)+'</div></div><div class="list-item"><div><div class="list-main">Estimated net profit</div><div class="list-meta">Agreed price minus costs used</div></div><div class="list-amount" style="color:var(--lime)">'+fmt(t.profit)+'</div></div></section><section class="card section-gap"><div class="card-head"><div><div class="card-title">Quick actions</div><div class="card-sub">Keep the work moving</div></div></div><div style="display:grid;gap:9px">'+btn('＋ Add expense','add-expense:'+j.id,'')+btn('＋ Record payment','add-payment:'+j.id,'')+btn('Create customer receipt','receipt:'+j.id,'primary')+btn('Share job summary on WhatsApp','whatsapp:'+j.id,'')+btn('Delete this job','delete-job:'+j.id,'danger')+'</div></section></div></div>'}
function render(){const main=document.getElementById('main');if(page==='home')main.innerHTML=dashboard();else if(page==='jobs')main.innerHTML=jobsPage();else if(page==='money')main.innerHTML=moneyPage();else if(page==='customers')main.innerHTML=customersPage();else if(page==='settings')main.innerHTML=settingsPage();else if(page==='detail')main.innerHTML=jobDetail(state.jobs.find(j=>j.id===selectedJob));else if(page==='receipt-page')main.innerHTML=receiptPage();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='detail'&&b.dataset.page==='jobs')));bindInputs()}
function go(p){if(p==='new'){openJobForm();return}page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function bindInputs(){const js=document.getElementById('jobSearch');if(js)js.addEventListener('input',e=>{jobSearch=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('jobSearch');n.focus();n.setSelectionRange(pos,pos)});const jf=document.getElementById('jobFilter');if(jf)jf.addEventListener('change',e=>{jobFilter=e.target.value;render()});const cs=document.getElementById('customerSearch');if(cs)cs.addEventListener('input',e=>{customerSearch=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('customerSearch');n.focus();n.setSelectionRange(pos,pos)});const mf=document.getElementById('moneyFilter');if(mf)mf.addEventListener('change',e=>{moneyFilter=e.target.value;render()})}
function openModal(title,body,submitLabel,submitFn){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow">WORKSLIP</div><div class="modal-title">'+title+'</div></div><button class="close" data-action="close-modal" aria-label="Close">×</button></div><form id="modalForm">'+body+'<div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">'+submitLabel+'</button></div></form></section></div>';root.querySelector('.modal').addEventListener('click',e=>e.stopPropagation());root.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()});root.querySelector('#modalForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());submitFn(data)});const first=root.querySelector('input:not([type=hidden]),select,textarea');if(first)setTimeout(()=>first.focus(),50)}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function field(name,label,value='',type='text',required=false,extra=''){return '<div class="form-group"><label class="field-label" for="f_'+name+'">'+label+(required?' *':'')+'</label><input class="field" id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+' '+extra+'></div>'}
function selectField(name,label,options,value){return '<div class="form-group"><label class="field-label" for="f_'+name+'">'+label+'</label><select class="field" id="f_'+name+'" name="'+name+'">'+options.map(o=>'<option '+(o===value?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>'}
function openJobForm(job){job=job||null;const editing=!!job;const j=job||{title:'',customer:'',phone:'',category:'Fabrication',description:'',price:'',estimate:'',due:'',priority:'Normal',status:'Confirmed',notes:''};openModal(editing?'Edit job':'Create a job', '<div class="form-grid">'+field('title','Job title',j.title,'text',true,'placeholder="e.g. Security gate fabrication"')+field('customer','Customer name',j.customer,'text',true,'placeholder="Who is the job for?"')+field('phone','Phone (optional)',j.phone,'tel',false,'placeholder="WhatsApp number if available"')+selectField('category','Job category',cats,j.category)+field('price','Agreed price (₦)',j.price,'number',true,'min="0" step="1" placeholder="0"')+field('estimate','Estimated materials cost (₦)',j.estimate,'number',false,'min="0" step="1" placeholder="0"')+field('due','Due date',j.due,'date')+selectField('priority','Priority',['Low','Normal','High'],j.priority)+selectField('status','Status',statuses,j.status)+'<div class="form-group full"><label class="field-label">Work description</label><textarea class="area" name="description" placeholder="What did you agree to do?">'+esc(j.description)+'</textarea></div><div class="form-group full"><label class="field-label">Private notes (not shown on receipts)</label><textarea class="area" name="notes" placeholder="Measurements to confirm, finishing, reminders…">'+esc(j.notes)+'</textarea></div></div>',editing?'Save changes':'Create job',d=>{if(!d.title.trim()||!d.customer.trim()){notify('Add a job title and customer name.');return}if(!Number.isFinite(Number(d.price))||Number(d.price)<0||Number(d.estimate||0)<0){notify('Enter valid non-negative amounts.');return}if(editing){Object.assign(job,{...d,price:Number(d.price),estimate:Number(d.estimate||0)});state.events.push({id:id(),jobId:job.id,date:today(),text:'Job details updated'})}else{const fresh={...d,id:id(),price:Number(d.price),estimate:Number(d.estimate||0),created:today()};state.jobs.unshift(fresh);state.events.push({id:id(),jobId:fresh.id,date:today(),text:'Job created'});selectedJob=fresh.id;page='detail'}save();closeModal();render();notify(editing?'Job updated.':'Job created. You’ve got this.')})}
function openExpenseForm(jobId){if(!jobId){const opts=state.jobs.filter(j=>j.status!=='Cancelled');if(!opts.length){notify('Create a job before adding an expense.');return}jobId=opts[0].id}const j=state.jobs.find(j=>j.id===jobId);openModal('Add a job cost','<div class="form-grid">'+selectField('jobId','Job',state.jobs.filter(j=>j.status!=='Cancelled').map(j=>j.id),jobId).replace(/<option>(.*?)<\/option>/g,(m,v)=>'<option value="'+esc(v)+'" '+(v===jobId?'selected':'')+'>'+esc(state.jobs.find(j=>j.id===v)?.title||v)+'</option>')+field('label','Expense description','','text',true,'placeholder="e.g. Steel rods"')+field('amount','Amount (₦)','','number',true,'min="1" step="1"')+selectField('category','Category',['Materials','Transport','Labour','Other'],'Materials')+field('date','Date',today(),'date')+'<div class="form-group full"><label class="field-label">Note (optional)</label><input class="field" name="note" placeholder="Any useful detail"></div></div><div class="notice">Once you record actual expenses, WorkSlip uses their total instead of the original materials estimate to avoid counting the estimate twice. Add every actual cost for a complete profit picture.</div>','Save expense',d=>{if(!d.label.trim()||Number(d.amount)<=0){notify('Enter an expense description and amount above zero.');return}state.expenses.push({...d,id:id(),amount:Number(d.amount)});state.events.push({id:id(),jobId:d.jobId,date:d.date,text:'Expense recorded: '+d.label});save();closeModal();selectedJob=d.jobId;page='detail';render();notify('Expense saved.')})}
function openPaymentForm(jobId){if(!jobId){const opts=state.jobs.filter(j=>j.status!=='Cancelled'&&totals(j).balance>0);if(!opts.length){notify('No outstanding balances to pay.');return}jobId=opts[0].id}const j=state.jobs.find(j=>j.id===jobId);const balance=j?totals(j).balance:0;openModal('Record a payment', (jobId?'<div class="notice" style="margin:0 0 16px">Job: <b>'+esc(j?.title||'')+'</b> · Still owed: <b>'+fmt(balance)+'</b></div>':'')+'<div class="form-grid">'+selectField('jobId','Job',state.jobs.filter(j=>j.status!=='Cancelled').map(j=>j.id),jobId).replace(/<option>(.*?)<\/option>/g,(m,v)=>'<option value="'+esc(v)+'" '+(v===jobId?'selected':'')+'>'+esc(state.jobs.find(j=>j.id===v)?.title||v)+'</option>')+field('amount','Amount received (₦)',balance||'','number',true,'min="1" step="1"')+selectField('method','Payment method',['Transfer','Cash','Other'],'Transfer')+field('date','Payment date',today(),'date')+'<div class="form-group full"><label class="field-label">Note (optional)</label><input class="field" name="note" placeholder="e.g. Deposit, final payment"></div></div>','Save payment',d=>{const job=state.jobs.find(j=>j.id===d.jobId),bal=job?totals(job).balance:0,amount=Number(d.amount);if(!job||!Number.isFinite(amount)||amount<=0){notify('Enter a valid payment amount.');return}if(amount>bal){notify('That is more than the outstanding balance ('+fmt(bal)+').');return}state.payments.push({...d,id:id(),amount});state.events.push({id:id(),jobId:d.jobId,date:d.date,text:'Payment received: '+fmt(amount)});save();closeModal();selectedJob=d.jobId;page='detail';render();notify('Payment recorded. Balance updated.')})}
function receiptPage(){const j=state.jobs.find(j=>j.id===receiptJob);if(!j)return '<div class="empty">Job not found.</div>';const t=totals(j);return header('CUSTOMER DOCUMENT','A clear record of the agreement.','Review the customer-facing receipt before printing.',btn('← Back to job','detail','ghost'))+'<div class="actions no-print" style="margin-bottom:14px"><button class="btn primary" data-action="print-receipt">Print / Save PDF</button><button class="btn" data-action="whatsapp:'+j.id+'">Share on WhatsApp</button><label class="btn" style="cursor:pointer"><input id="receiptCosts" type="checkbox" '+(receiptShowCosts?'checked':'')+' style="accent-color:var(--lime)"> Include costs</label></div><div class="receipt-wrap"><section class="receipt" id="receipt"><div class="receipt-brand">WorkSlip<span style="color:#719a2a">.</span></div><div style="font-size:11px;color:#777;margin-top:5px">WORK ORDER / PAYMENT RECEIPT</div><hr class="receipt-rule"><div class="receipt-line"><span>Reference</span><b>WS-'+j.id.slice(-6).toUpperCase()+'</b></div><div class="receipt-line"><span>Date issued</span><b>'+shortDate(today())+'</b></div><div class="receipt-line"><span>Customer</span><b>'+esc(j.customer)+'</b></div>'+(j.phone?'<div class="receipt-line"><span>Phone</span><b>'+esc(j.phone)+'</b></div>':'')+'<hr class="receipt-rule"><div class="receipt-label">Work description</div><p>'+esc(j.description||j.title)+'</p><div class="receipt-line"><span>Job</span><b>'+esc(j.title)+'</b></div><div class="receipt-line"><span>Status</span><b>'+esc(j.status)+'</b></div><div class="receipt-line"><span>Agreed price</span><b>'+fmt(j.price)+'</b></div><div class="receipt-line"><span>Payments received</span><b>'+fmt(t.paid)+'</b></div><hr class="receipt-rule"><div class="receipt-line receipt-total"><span>Balance due</span><span>'+fmt(t.balance)+'</span></div>'+(receiptShowCosts?'<hr class="receipt-rule"><div class="receipt-label">Internal cost details, included by request</div><div class="receipt-line"><span>Costs used</span><b>'+fmt(t.cost)+'</b></div><div class="receipt-line"><span>Estimated profit</span><b>'+fmt(t.profit)+'</b></div>':'')+'<hr class="receipt-rule"><p>Thank you for your business. Please keep this document for your records.</p><div style="font-size:10px;color:#777;margin-top:25px">Generated with WorkSlip · Every job. Every cost. Every payment.</div></section></div>'}
function openReceipt(jobId){receiptJob=jobId;receiptShowCosts=false;page='receipt-page';render()}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Export ready: '+name)}
function csvExport(){const cols=['id','title','customer','phone','category','description','price','estimate','due','priority','status','created'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('workslip-jobs-'+today()+'.csv',[cols.join(','),...state.jobs.map(j=>cols.map(k=>q(j[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')}
function jsonExport(){download('workslip-backup-'+today()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json')}
function whatsapp(id){const j=state.jobs.find(x=>x.id===id);if(!j)return;const t=totals(j),message='WorkSlip job update\nJob: '+j.title+'\nCustomer: '+j.customer+'\nAgreed price: '+fmt(j.price)+'\nPaid: '+fmt(t.paid)+'\nBalance due: '+fmt(t.balance)+'\nStatus: '+j.status+(j.due?'\nDue: '+shortDate(j.due):'');window.open('https://wa.me/?text='+encodeURIComponent(message),'_blank','noopener,noreferrer')}
function deleteJob(id){const j=state.jobs.find(j=>j.id===id);if(!j)return;if(!confirm('Delete "'+j.title+'" and its linked expenses, payments, and activity? This cannot be undone.'))return;state.jobs=state.jobs.filter(x=>x.id!==id);state.expenses=state.expenses.filter(x=>x.jobId!==id);state.payments=state.payments.filter(x=>x.jobId!==id);state.events=state.events.filter(x=>x.jobId!==id);save();page='jobs';render();notify('Job deleted.')}
function customerDetail(name){const jobs=state.jobs.filter(j=>j.customer.toLowerCase()===name.toLowerCase());openModal(name,'<div class="subtitle">Customer overview and job history</div><div class="section-gap">'+jobs.map(j=>'<div class="list-item"><div><div class="list-main">'+esc(j.title)+'</div><div class="list-meta">'+badge(j.status)+' · '+shortDate(j.created)+'</div></div><div class="list-amount">'+fmt(j.price)+'<div class="list-meta">Owes '+fmt(totals(j).balance)+'</div></div></div>').join('')+'</div><div class="notice">Customer totals are calculated from jobs saved in this browser.</div>','Create another job',()=>{closeModal();openJobForm({customer:name,phone:jobs[0]?.phone||'',title:'',category:'Other',description:'',price:'',estimate:'',due:'',priority:'Normal',status:'Confirmed',notes:''})})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-page]');if(!el)return;if(el.dataset.page){e.preventDefault();go(el.dataset.page);return}const a=el.dataset.action;if(!a)return;if(a==='close-modal'){closeModal();return}if(a==='new-job'){openJobForm();return}if(a==='add-payment'){openPaymentForm();return}if(a==='add-expense'){openExpenseForm();return}if(a==='export-json'){jsonExport();return}if(a==='export-csv'){csvExport();return}if(a==='import-json'){document.getElementById('importFile').click();return}if(a==='clear-demo'){if(!confirm('Remove the sample jobs and their linked demo expenses and payments? Your other jobs will stay.'))return;const ids=state.jobs.filter(j=>j.demo).map(j=>j.id);state.jobs=state.jobs.filter(j=>!j.demo);state.expenses=state.expenses.filter(x=>!ids.includes(x.jobId));state.payments=state.payments.filter(x=>!ids.includes(x.jobId));state.events=state.events.filter(x=>!ids.includes(x.jobId));state.demoLoaded=true;save();render();notify('Demo records cleared.');return}if(a==='clear-all'){if(!confirm('Permanently delete every WorkSlip job, payment, and expense from this browser? Export a backup first if needed.'))return;state=emptyState();save();page='home';selectedJob=null;render();notify('All records cleared.');return}if(a==='open-job'){selectedJob=el.dataset.id;page='detail';render();return}if(a==='customer-detail'){customerDetail(el.dataset.customer);return}if(a==='edit-job:'+selectedJob){openJobForm(state.jobs.find(j=>j.id===selectedJob));return}if(a.startsWith('edit-job:')){openJobForm(state.jobs.find(j=>j.id===a.split(':')[1]));return}if(a.startsWith('add-payment:')){openPaymentForm(a.split(':')[1]);return}if(a.startsWith('add-expense:')){openExpenseForm(a.split(':')[1]);return}if(a.startsWith('receipt:')){openReceipt(a.split(':')[1]);return}if(a.startsWith('whatsapp:')){whatsapp(a.split(':')[1]);return}if(a.startsWith('delete-job:')){deleteJob(a.split(':')[1]);return}if(a.startsWith('delete-expense:')){const x=a.split(':')[1];if(confirm('Delete this expense?')){state.expenses=state.expenses.filter(e=>e.id!==x);save();render();notify('Expense deleted.')}return}if(a.startsWith('delete-payment:')){const x=a.split(':')[1];if(confirm('Delete this payment record? The balance will increase.')){state.payments=state.payments.filter(p=>p.id!==x);save();render();notify('Payment record deleted.')}return}if(a.startsWith('save-status:')){const j=state.jobs.find(j=>j.id===a.split(':')[1]),s=document.getElementById('detailStatus');if(j&&s){j.status=s.value;state.events.push({id:id(),jobId:j.id,date:today(),text:'Status changed to '+j.status});save();render();notify('Job status updated.')}return}if(a==='print-receipt'){window.print();return}});
document.addEventListener('change',e=>{if(e.target.id==='receiptCosts'){receiptShowCosts=e.target.checked;render()}if(e.target.id==='importFile'&&e.target.files[0]){const file=e.target.files[0],reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result),data=x.data||x;if(!Array.isArray(data.jobs)||!Array.isArray(data.payments)||!Array.isArray(data.expenses))throw new Error('Invalid backup format');if(!confirm('Import will replace the current local records. Continue?'))return;state={...emptyState(),...data};save();page='home';render();notify('Backup restored.')}catch(err){notify('Could not import. Choose a valid WorkSlip JSON backup.')}e.target.value=''};reader.readAsText(file)}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-action="backdrop-close"]');if(a&&e.target===a)closeModal()});
loadDemo();render();
})();</script>
